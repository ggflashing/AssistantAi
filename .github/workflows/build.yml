name: Android AI CI

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt from Android"
        required: true
        type: string
      history:
        description: "Chat history"
        required: false
        type: string

jobs:
  ai-job:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Call Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINIAPIKEY }}
        run: |
          for i in {1..5}; do
            echo "Attempt $i"

            REQUEST=$(jq -n \
              --arg history "${{ inputs.history }}" \
              --arg text "${{ inputs.prompt }}" \
              '{
                contents: (
                  (if $history == "" then [] else ($history | fromjson) end)
                  +
                  [{
                    role: "user",
                    parts: [{text: $text}]
                  }]
                )
              }')

            echo "$REQUEST"

            RESPONSE=$(curl -s -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-preview:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$REQUEST")

            echo "$RESPONSE" > response.json

            if jq -e '.candidates[0].content.parts[0].text' response.json > /dev/null; then
              echo "Success"
              break
            fi

            echo "Retrying in 5 seconds..."
            sleep 5
          done

      - name: Extract clean text
        run: |
          TEXT=$(jq -r '.candidates[0].content.parts[0].text' response.json)
          echo "$TEXT" > result.json

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ai-result
          path: result.json
